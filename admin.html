<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales System — Leads</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f7f9fc}.admin{max-width:1200px;margin:auto;padding:45px 5%}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.admin h1{font-size:36px;letter-spacing:-.04em;margin:5px 0}.muted{color:#64748b}.panel{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:25px;box-shadow:0 12px 35px #0b12200a}.login{max-width:430px;margin:12vh auto}.login h1{font-size:30px}.admin input{width:100%;padding:13px;border:1px solid #d8e0ea;border-radius:9px;margin:7px 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:13px 10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:12px;vertical-align:top}.table th{color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;background:#eff6ff;color:#2563eb;border-radius:999px;padding:5px 8px;font-weight:700;font-size:10px}.empty{text-align:center;padding:60px;color:#64748b}.error{color:#dc2626;font-size:12px;margin:8px 0}.top-actions{display:flex;gap:10px}.smallbtn{border:1px solid #d8e0ea;background:#fff;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.smallbtn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.count{font-size:13px;color:#64748b;margin-bottom:15px}</style></head><body>
<header class="nav"><a class="brand" href="/"><span class="brand-mark">S</span> Sales System</a><a class="nav-cta" href="/">Back to Website</a></header>
<main class="admin"><section id="loginPanel" class="panel login"><div class="kicker">ADMIN DASHBOARD</div><h1>Trial Leads</h1><p class="muted">Enter your admin password to view new 7-day free trial requests.</p><form id="login"><label class="muted">Admin password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary full">Open Leads Dashboard</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" hidden><div class="admin-head"><div><div class="kicker">SALES SYSTEM</div><h1>Trial Leads</h1><p class="muted">Every submitted 7-day free trial request appears here.</p></div><div class="top-actions"><button id="refresh" class="smallbtn">Refresh</button><button id="csv" class="smallbtn primary">Export CSV</button></div></div><div class="panel"><div id="count" class="count"></div><div id="table" class="table-wrap"></div></div></section></main>
<script>
const login=document.querySelector('#login'), loginPanel=document.querySelector('#loginPanel'), dashboard=document.querySelector('#dashboard'), error=document.querySelector('#loginError');
login.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const button=login.querySelector('button');button.disabled=true;button.textContent='Checking…';try{const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.querySelector('#password').value})});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}if(!r.ok){error.textContent=d.error||`Login failed (${r.status}).`;return}loginPanel.hidden=true;dashboard.hidden=false;load();}catch(err){error.textContent='Unable to reach the admin service. Please try again.';}finally{button.disabled=false;button.textContent='Open Leads Dashboard';}});
let leads=[];
async function load(){try{const r=await fetch('/.netlify/functions/trial',{credentials:'same-origin',headers:{'Accept':'application/json'}});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{}if(!r.ok){dashboard.hidden=true;loginPanel.hidden=false;error.textContent=d.error||'Your session expired. Please log in again.';return}leads=d.leads||[];render();}catch(err){dashboard.hidden=true;loginPanel.hidden=false;error.textContent='Unable to reach the lead database. Please try again.';}}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){document.querySelector('#count').textContent=`${leads.length} trial request${leads.length===1?'':'s'}`;if(!leads.length){document.querySelector('#table').innerHTML='<div class="empty">No trial requests yet.</div>';return}document.querySelector('#table').innerHTML='<table class="table"><thead><tr><th>Date</th><th>Name</th><th>Business</th><th>WhatsApp</th><th>What They Sell</th><th>Product / Service</th><th>Traffic</th><th>Goal</th><th>Website / Social</th></tr></thead><tbody>'+leads.map(x=>`<tr><td>${esc(new Date(x.createdAt).toLocaleString())}</td><td><strong>${esc(x.fullName)}</strong></td><td>${esc(x.businessName)}</td><td>${esc(x.whatsapp)}</td><td>${esc(x.businessSells)}</td><td>${esc(x.product)}</td><td><span class="pill">${esc(x.traffic)}</span></td><td>${esc(x.goal)}</td><td>${esc(x.website)}<br>${esc(x.social)}</td></tr>`).join('')+'</tbody></table>'}
document.querySelector('#refresh').onclick=load;
document.querySelector('#csv').onclick=()=>{if(!leads.length)return;const fields=['createdAt','fullName','businessName','businessSells','whatsapp','website','social','product','traffic','goal'];const csv=[fields.join(','),...leads.map(x=>fields.map(f=>`"${String(x[f]??'').replace(/"/g,'""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sales-system-trial-leads.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
